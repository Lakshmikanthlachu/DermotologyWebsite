<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon | Solene Dermatology &amp; Skin Clinic</title>
<meta name="description" content="Our new clinic location is launching soon. Sign up to be notified.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%232563EB'/%3E%3Ctext x='50' y='68' font-size='58' fill='%23EC4899' text-anchor='middle' font-family='sans-serif'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class', theme: { extend: {
    fontFamily: { display: ['Bricolage Grotesque','sans-serif'], sans: ['Plus Jakarta Sans','sans-serif'] },
    boxShadow: { soft: '0 10px 30px -10px rgba(37,99,235,0.16)', premium: '0 20px 60px -15px rgba(37,99,235,0.32)' },
    colors: {
      ink: 'rgb(var(--color-ink) / <alpha-value>)',
      'ink-soft': 'rgb(var(--color-ink-soft) / <alpha-value>)',
      primary: 'rgb(var(--color-primary) / <alpha-value>)',
      accent: 'rgb(var(--color-accent) / <alpha-value>)',
      cream: 'rgb(var(--color-cream) / <alpha-value>)',
      surface: 'rgb(var(--color-cream) / <alpha-value>)',
      blush: 'rgb(var(--color-blush) / <alpha-value>)'
    }
  } } }
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-ink-fixed text-white font-sans antialiased overflow-x-hidden min-h-screen relative">

<img loading="lazy" class="absolute inset-0 w-full h-full object-cover opacity-25" src="https://images.unsplash.com/photo-1629909613654-28e377c37b09?q=80&w=1800&auto=format&fit=crop" alt="New Solene clinic location">
<div class="absolute inset-0 scrim-solid"></div>

<header class="relative z-10">
  <div class="max-w-7xl mx-auto px-6 lg:px-8 py-8 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-2.5">
      <span class="w-10 h-10 rounded-full bg-white/10 border border-white/15 flex items-center justify-center text-white text-lg"><i class="fa-solid fa-droplet"></i></span>
      <span class="font-display text-xl font-bold text-white">Solene <span class="text-accent">Clinic</span></span>
    </a>
    <a href="index.html" class="text-sm font-semibold text-white/70 hover:text-accent">← Back to main site</a>
  </div>
</header>

<section class="relative z-10 flex items-center justify-center px-6 py-20" style="min-height:calc(100vh - 96px)">
  <div class="text-center max-w-2xl reveal in-view">
    <span class="eyebrow eyebrow-frost">Under Construction</span>
    <h1 class="font-display text-4xl sm:text-5xl lg:text-6xl font-bold mt-6 leading-tight">Our Downtown Clinic Is <span class="text-accent italic">Almost Ready</span></h1>
    <p class="text-white/70 mt-5 max-w-lg mx-auto">We're putting the finishing touches on our newest Solene location. Leave your email and we'll notify you the moment we open.</p>

    <div class="flex items-center justify-center gap-2 sm:gap-5 mt-12">
      <div class="bg-white/5 border border-white/10 rounded-2xl px-3 py-3 sm:px-7 sm:py-5 min-w-[64px] sm:min-w-[96px]">
        <p id="cd-days" class="font-display text-2xl sm:text-4xl font-bold text-accent">00</p>
        <p class="text-[10px] sm:text-xs text-white/50 uppercase tracking-wide mt-1">Days</p>
      </div>
      <div class="bg-white/5 border border-white/10 rounded-2xl px-3 py-3 sm:px-7 sm:py-5 min-w-[64px] sm:min-w-[96px]">
        <p id="cd-hours" class="font-display text-2xl sm:text-4xl font-bold text-accent">00</p>
        <p class="text-[10px] sm:text-xs text-white/50 uppercase tracking-wide mt-1">Hours</p>
      </div>
      <div class="bg-white/5 border border-white/10 rounded-2xl px-3 py-3 sm:px-7 sm:py-5 min-w-[64px] sm:min-w-[96px]">
        <p id="cd-mins" class="font-display text-2xl sm:text-4xl font-bold text-accent">00</p>
        <p class="text-[10px] sm:text-xs text-white/50 uppercase tracking-wide mt-1">Minutes</p>
      </div>
      <div class="bg-white/5 border border-white/10 rounded-2xl px-3 py-3 sm:px-7 sm:py-5 min-w-[64px] sm:min-w-[96px]">
        <p id="cd-secs" class="font-display text-2xl sm:text-4xl font-bold text-accent">00</p>
        <p class="text-[10px] sm:text-xs text-white/50 uppercase tracking-wide mt-1">Seconds</p>
      </div>
    </div>

    <form data-demo-form="You're on the list! We'll email you at launch." class="flex flex-col sm:flex-row gap-3 max-w-md mx-auto mt-12">
      <input required type="email" placeholder="Enter your email" class="input-premium !bg-white/5 !border-white/15 !text-white flex-1">
      <button class="btn btn-accent shrink-0">Notify Me</button>
    </form>

    <div class="flex items-center justify-center gap-4 mt-10">
      <a href="https://www.facebook.com/" target="_blank" rel="noopener" aria-label="Solene on Facebook" class="w-11 h-11 rounded-full bg-white/10 hover:bg-accent hover:text-ink flex items-center justify-center transition"><i class="fa-brands fa-facebook-f"></i></a>
      <a href="https://www.instagram.com/" target="_blank" rel="noopener" aria-label="Solene on Instagram" class="w-11 h-11 rounded-full bg-white/10 hover:bg-accent hover:text-ink flex items-center justify-center transition"><i class="fa-brands fa-instagram"></i></a>
      <a href="https://www.linkedin.com/" target="_blank" rel="noopener" aria-label="Solene on LinkedIn" class="w-11 h-11 rounded-full bg-white/10 hover:bg-accent hover:text-ink flex items-center justify-center transition"><i class="fa-brands fa-linkedin-in"></i></a>
    </div>
  </div>
</section>

<script src="js/main.js"></script>
</body>
</html>
